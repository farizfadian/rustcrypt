# ═══════════════════════════════════════════════════════════════════════════════
# RustCrypt - Release Workflow
# ═══════════════════════════════════════════════════════════════════════════════
#
# Triggered by pushing a version tag:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# This will:
# 1. Run the full check suite (fmt, clippy, tests, no-default-features build)
# 2. Create a GitHub Release with the matching CHANGELOG.md section as body
# 3. Build the `rustcrypt` CLI for 5 targets and attach the archives
#    (rustcrypt-<version>-<target>.tar.gz / .zip) plus SHA-256 checksums
# 4. Publish the crate to crates.io using the CARGO_REGISTRY_TOKEN secret
#
# Required repository secret: CARGO_REGISTRY_TOKEN (crates.io API token with
# publish-new / publish-update scope for rustcrypt-jasypt).
#
# An idea from Fariz and made with love by Claude AI
# ═══════════════════════════════════════════════════════════════════════════════

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features --locked

      - name: Build (no default features)
        run: cargo build --no-default-features --locked

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          echo "tag=$TAG_VERSION crate=$CRATE_VERSION"
          test "$TAG_VERSION" = "$CRATE_VERSION"

  create-release:
    name: Create GitHub Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release from CHANGELOG.md
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          title: RustCrypt $version
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cross toolchain (aarch64 linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and upload rustcrypt-${{ steps.version.outputs.version }}-${{ matrix.target }}
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: rustcrypt
          target: ${{ matrix.target }}
          archive: rustcrypt-${{ steps.version.outputs.version }}-$target
          tar: unix
          zip: windows
          checksum: sha256
          locked: true
          include: LICENSE,README.md,CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        run: cargo publish --locked --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
